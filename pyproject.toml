[project]
name = "ann-solid-materials"
version = "0.1.0"
description = "Neural network framework for learning constitutive laws of solid materials using 3D U-Net"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Paul Devianne", email = "paul.devianne@example.com" }
]
keywords = ["machine-learning", "materials-science", "computational-mechanics", "u-net", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "mlflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipykernel>=6.25.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/p-devianne/ann_solidMaterialLaws"
Repository = "https://github.com/p-devianne/ann_solidMaterialLaws"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ann_solid_materials"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/ann_solid_materials --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
